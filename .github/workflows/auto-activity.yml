name: Auto Activity

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository using Node 24 compatible version
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Generate random activity
      - name: Generate activity
        run: |
          python3 << 'PY'
          import random
          from datetime import datetime, timezone

          # 70% chance: do nothing
          if random.random() < 0.70:
              raise SystemExit(0)

          msgs = [
              "docs: update notes",
              "fix: minor issue",
              "refactor: cleanup",
              "chore: maintenance",
              "style: formatting",
              "feat: improve project",
              "test: update",
              "build: refresh"
          ]

          # Add timestamp to activity log
          with open("activity.log", "a") as f:
              f.write(
                  datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
                  + "\n"
              )

          # Create random commit message
          with open(".commitmsg", "w") as f:
              f.write(random.choice(msgs))
          PY

      # Commit and push changes
      - name: Commit and Push
        run: |
          test -f .commitmsg || exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity.log

          # Create commit
          git commit -m "$(cat .commitmsg)" || exit 0

          # Get latest changes from GitHub
          git fetch origin main

          # Rebase our commit on top of the latest remote commit
          git rebase origin/main

          # Push changes
          git push origin main
